apiVersion: batch/v1
kind: Job
metadata:
  name: init-db-__RUN_ID__
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 120
  ttlSecondsAfterFinished: 600
  template:
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      containers:
        - name: init
          image: __IMAGE__@__DIGEST__
          command: [flask, --app, app.main, init-db]
          envFrom:
            - secretRef: {name: inventory-api-secret}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 250m, memory: 128Mi}
