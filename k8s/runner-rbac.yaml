# Bootstrap once with cluster administrator credentials.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: item-deployer
  namespace: inventory-api
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: item-deployer
  namespace: inventory-api
rules:
  - apiGroups: ['']
    resources: [configmaps, services, persistentvolumeclaims]
    verbs: [get, list, watch, create, update, patch]
  - apiGroups: ['']
    resources: [pods, pods/log, events]
    verbs: [get, list, watch]
  - apiGroups: ['']
    resources: [secrets]
    resourceNames: [inventory-api-secret, postgres-secret]
    verbs: [get]
  - apiGroups: [apps]
    resources: [deployments, replicasets]
    verbs: [get, list, watch, create, update, patch]
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [get, list, watch, create, update, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: item-deployer
  namespace: inventory-api
subjects:
  - kind: ServiceAccount
    name: item-deployer
    namespace: inventory-api
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: item-deployer
