name: Release and deploy
on:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: production-release
  cancel-in-progress: false
jobs:
  validate:
    uses: ./.github/workflows/ci.yml
  publish:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    outputs:
      image: ${{ steps.release.outputs.image }}
      version: ${{ steps.release.outputs.version }}
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check new release identifier
        id: release
        shell: bash
        run: |
          version=$(python scripts/validate_release.py)
          existing=$(git ls-remote --tags origin "refs/tags/$version")
          if [ -n "$existing" ]; then
            echo "Release tag already exists: $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          name: validated-image
          path: /tmp/image
      - run: docker load -i /tmp/image/validated-image.tar
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish validated image and record digest
        id: push
        env:
          IMAGE: ${{ steps.release.outputs.image }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          docker tag inventory-api:validated "$IMAGE:$VERSION"
          docker tag inventory-api:validated "$IMAGE:sha-$GITHUB_SHA"
          docker push "$IMAGE:$VERSION"
          docker push "$IMAGE:sha-$GITHUB_SHA"
          digest=$(docker inspect --format='{{index .RepoDigests 0}}' "$IMAGE:$VERSION")
          echo "digest=${digest#*@}" >> "$GITHUB_OUTPUT"
          git tag "$VERSION" "$GITHUB_SHA"
          git push origin "$VERSION"
  deploy:
    needs: publish
    runs-on: [self-hosted, linux, k8s]
    environment: production
    env:
      IMAGE: ${{ needs.publish.outputs.image }}
      VERSION: ${{ needs.publish.outputs.version }}
      DIGEST: ${{ needs.publish.outputs.digest }}
      KUBECONFIG: ${{ runner.temp }}/inventory-api-kubeconfig
    steps:
      - uses: actions/checkout@v4
      - name: Configure protected cluster credentials
        env:
          KUBE_CONFIG_B64: ${{ secrets.KUBE_CONFIG_B64 }}
        run: |
          umask 077
          printf '%s' "$KUBE_CONFIG_B64" | base64 --decode > "$KUBECONFIG"
          test -s "$KUBECONFIG"
      - name: Deploy and verify
        run: bash scripts/deploy.sh
      - name: Save deployment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deployment-evidence
          path: rendered/evidence/
      - name: Deployment result
        if: always()
        run: echo 'Deployment job result - ${{ job.status }}' >> "$GITHUB_STEP_SUMMARY"
      - name: Remove cluster credentials
        if: always()
        run: rm -f "$KUBECONFIG"
